<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAM Housing — Data Viewer</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --accent: #3b82f6;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --font: 'Segoe UI', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            padding: 1rem;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        h1 span {
            font-size: .75rem;
            color: var(--muted);
            background: var(--card);
            padding: .2rem .5rem;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .78rem;
            margin-bottom: 1rem;
        }

        th {
            background: var(--card);
            position: sticky;
            top: 0;
            text-align: left;
            padding: .5rem;
            color: var(--muted);
            border-bottom: 2px solid var(--accent);
            white-space: nowrap;
        }

        td {
            padding: .3rem .5rem;
            border-bottom: 1px solid var(--border);
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr:hover td {
            background: rgba(59, 130, 246, .07);
        }

        .scroll {
            overflow-x: auto;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h1>🏠 SAM Housing — Data Viewer (Flat File from Excel) <span>localhost:8000</span></h1>
    <div class="scroll" id="table-area">Loading massive flat table...</div>
    <script>
        function h(s) { return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
        (async () => {
            try {
                const rows = await (await fetch(`/admin/tables/housing_data`)).json();
                if (!rows.length) { document.getElementById('table-area').innerHTML = '<p>No data</p>'; return; }
                const cols = Object.keys(rows[0]);
                let html = '<table><tr>' + cols.map(c => `<th>${h(c)}</th>`).join('') + '</tr>';
                rows.forEach(r => {
                    html += '<tr>' + cols.map(c => `<td title="${h(r[c])}">${h(r[c])}</td>`).join('') + '</tr>';
                });
                html += '</table>';
                document.getElementById('table-area').innerHTML = html;
            } catch (e) { document.getElementById('table-area').innerHTML = `<p>${e}</p>`; }
        })();
    </script>
</body>

</html>
