x-sa-password: &sa_password "Housing#Sa2026"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sam-housing-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *sa_password
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      retries: 30
      start_period: 20s

  # One-shot seed: loads db/init/01_schema.sql only when the housing database doesn't exist yet
  # (same behaviour as MySQL's init dir). Reset with `docker compose down -v`.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sam-housing-db-init
    environment:
      MSSQL_SA_PASSWORD: *sa_password
    volumes:
      - ./db/init:/init:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        SQL="/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P $$MSSQL_SA_PASSWORD -C -b"
        if [ "$$($$SQL -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = 'housing'")" = "1" ]; then
          echo "housing database exists, skipping seed"
        else
          $$SQL -f 65001 -i /init/01_schema.sql && echo "seed loaded"
        fi
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    container_name: sam-housing-api
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 1433
      DATABASE_USER: housing
      DATABASE_PASSWORD: housing123
      DATABASE_NAME: housing
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  mssqldata:
